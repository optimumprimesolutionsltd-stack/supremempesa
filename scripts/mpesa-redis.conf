bind 127.0.0.1
port 6379
protected-mode yes
# BullMQ refuses to run against an evicting Redis: losing a job key loses a receipt.
maxmemory-policy noeviction
appendonly yes
appendfsync everysec
save 900 1
save 300 10


# Set these to absolute paths under .devstack/ before starting:
# dir "/path/to/.devstack/data/redis"
# logfile "/path/to/.devstack/logs/redis.log"
